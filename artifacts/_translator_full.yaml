canonical_sampling:
  cache_path: artifacts/canonical_qwen.json
  enabled: true
  max_attempts_multiplier: 1
  sampler_models:
  - device: cuda
    dtype: bfloat16
    local_model_path: Qwen/Qwen2.5-Coder-14B
    max_tokens: 1400
    model: Qwen/Qwen2.5-Coder-14B
    name: qwen2.5-coder-14B
    temperature: 0.8
    top_p: 0.95
  samples_per_model: 20
datasets:
- name: humaneval
  prompt:
    mode: chat
    prefix: 'Follow the instructions below and output a complete {language} solution.

      '
    system: 'You are an expert {language} programmer. Produce the requested function
      without explanations or Markdown fences.

      '
  source: humaneval
  task_type: cg
- name: mbpp
  prompt:
    mode: chat
    prefix: 'Complete the following specification using standard {language}.

      '
    system: 'Solve the task by outputting a single {language} function. Do not wrap
      the answer in backticks or natural language commentary.

      '
  source: mbpp
  task_type: cg
- extra:
    sample_canonical: true
  language: java
  name: humaneval_java
  path: data/HumanEval.jsonl
  prompt:
    mode: chat
    prefix: 'Solve or repair the following task in {language}.

      '
    system: 'You are an expert {language} programmer. Output only valid {language}
      code.

      '
  source: jsonl
  task_type: apr
eval_models:
- device: cuda
  dtype: bfloat16
  max_tokens: 1400
  model: mistralai/Mistral-Nemo-Instruct-2407
  name: mistral-nemo
execution_timeout: 120
output_csv: artifacts/collu-bench.csv
prompt_translation:
  cache_path: artifacts/prompt_translations.json
  enabled: true
  translate_solutions: true
  translator:
    device: cpu
    dtype: float32
    model: org/custom-model
    name: custom-translator
target_language: go
workspace: artifacts/workspace
