output_dataset: artifacts/collu-bench
execution_timeout: 120
workspace: artifacts/workspace

datasets:
  - name: humaneval
    source: humaneval
    task_type: cg
    sample_size: 3  # optional: load only the first N tasks
    prompt:
      mode: chat
      system: >
        You are an expert Python programmer. Produce the requested function
        without explanations or Markdown fences.
      prefix: |
        Follow the instructions below and output a complete Python solution.
  - name: mbpp
    source: mbpp
    task_type: cg
    sample_size: 3
    prompt:
      mode: chat
      system: >
        Solve the task by outputting a single Python function. Do not wrap the
        answer in backticks or natural language commentary.
      prefix: >
        Complete the following specification using standard Python.
  - name: humaneval_java
    source: jsonl
    path: data/HumanEval.jsonl
    task_type: apr
    language: java
    sample_size: 3
    extra:
      sample_canonical: true
    prompt:
      prefix: >
        You are repairing a buggy Java snippet. Output the full patch that fixes
        the failing tests.

canonical_sampling:
  enabled: true
  samples_per_model: 20
  max_attempts_multiplier: 1
  cache_path: artifacts/canonical_qwen.json
  sampler_models:
    - name: Qwen3.6-35B-A3B
      model: Qwen/Qwen3.6-35B-A3B
      local_model_path: Qwen/Qwen3.6-35B-A3B
      device: cuda
      dtype: bfloat16
      temperature: 0.8
      max_tokens: 1000
      top_p: 0.95

eval_models:
  - name: deepseek-coder-1.3b-instruct
    model: deepseek-ai/deepseek-coder-1.3b-instruct 
    max_tokens: 1000
    device: cuda
    dtype: bfloat16
